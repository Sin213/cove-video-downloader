name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (no leading v)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run backend unit tests
        run: python -m pytest tests/ -q

      # Production scripts must keep working on the Node the build jobs use.
      # The test job runs on 22 (see below), so without this nothing would
      # exercise the shipped scripts under 20.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Smoke-check production scripts on Node 20
        run: |
          node --version
          for f in main.js preload.js portable.js scripts/vendor-assets.js scripts/fetch-runtimes.js; do
            node --check "$f"
          done
          node scripts/vendor-assets.js
          test -f renderer/vendor/react.production.min.js
          test -f renderer/vendor/fonts/geist.css

      # Node 22: the test runner's glob support and the object form of
      # mock.timers.enable({ apis: [...] }) both require >= 21.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run main-process lifecycle tests
        run: node --test "tests/js/*.test.js"

      # A tag that disagrees with package.json ships artifacts whose filenames
      # do not match the release they are attached to.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install system deps (libfuse2 for AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 unzip

      - name: Install npm deps
        run: npm ci

      - name: Build Linux AppImage + deb
        run: npm run dist:linux -- --publish never

      # `[ -f "$f" ] && ...` as the last command in the loop body makes the
      # step exit non-zero when a glob matches nothing, so a dropped target
      # took down the checksum step instead of the build step. Count matches
      # and fail loudly only when nothing at all was produced.
      - name: Generate SHA256 checksums
        run: |
          cd release
          shopt -s nullglob
          n=0
          for f in *.AppImage *.deb; do
            sha256sum "$f" > "$f.sha256"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::no Linux artifacts were produced"
            exit 1
          fi
          echo "checksummed $n artifact(s)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
            release/*.deb
            release/*.deb.sha256
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build Windows Setup + Portable
        run: npm run dist:win -- --publish never

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          n=0
          for f in *-Setup.exe *-Portable.exe; do
            sha256sum "$f" > "$f.sha256"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::no Windows artifacts were produced"
            exit 1
          fi
          echo "checksummed $n artifact(s)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.sha256
            release/*-Portable.exe
            release/*-Portable.exe.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/linux-builds/*
            artifacts/windows-builds/*
          fail_on_unmatched_files: true
